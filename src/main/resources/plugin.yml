name: mcrtd
version: '${version}'

main: me.arvia.mcrtd.RollTheDiceMC
api-version: '26.1.2'
load: POSTWORLD

commands:
  rtd:
    description: Rolls the dice
    usage: /<command>
  rtd-clear:
    description: Removes the effect from the player in the argument
    usage: /<command> <playerName>
    default: op
  rtd-set-cooldown:
    description: Allows operators to change cooldown between rolls (default 40)
    usage: /<command> <cooldownSeconds>
    default: op